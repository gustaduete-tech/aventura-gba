name: Compilar Aventura GBA

on:
  workflow_dispatch:
  push:
    branches: [principal, main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Compilar
        run: make

      - name: Guardar arquivo GBA
        uses: actions/upload-artifact@v4
        with:
          name: aventura-gba
          path: aventura.gba
          if-no-files-found: error
